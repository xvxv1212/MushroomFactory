<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내가 작성한 시츄에이션</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #F5F5F5;
            color: #222;
            font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        }

        .admin-container {
            max-width: 720px;
            margin: 0 auto;
        }

        .admin-summary {
            margin: 0 0 16px;
            color: #555;
            font-size: 0.9rem;
        }

        .admin-empty {
            color: #888;
            font-size: 0.9rem;
        }

        table {
            width: 100%;
            background: #FFFFFF;
            border: 1px solid #DDD;
            border-radius: 8px;
            border-collapse: collapse;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.9rem;
            border-bottom: 1px solid #E5E5E5;
        }

        th {
            background: #FAFAFA;
            color: #555;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td a {
            color: #333;
            text-decoration: none;
        }

        td a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <p class="admin-summary">
            {{ admin_id }} 님이 작성하신 시츄에이션의 갯수는 총 {{ total_count }} 건입니다.
        </p>
        {% if not llm_roles %}
            <span class="admin-empty">작성한 시츄에이션이 없습니다</span>
        {% else %}
            <table>
                <tr>
                    <th>일련번호</th>
                    <th>제목</th>
                    <th>작성일시</th>
                </tr>
                {% for llm_role in llm_roles %}
                    <tr>
                        <td>
                            {{ llm_role.lr_num }}
                        </td>
                        <td>
                            <a href="/admins/llmRole/{{ llm_role.lr_num }}">{{ llm_role.title }}</a>
                        </td>
                        <td>
                            {{ llm_role.created_at }}
                        </td>
                    </tr>
                {% endfor %}
            </table>
        {% endif %}
    </div>
</body>
</html>
