<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 페이지</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #F5F5F5;
            color: #222;
            font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        }

        .admin-container {
            max-width: 480px;
            margin: 0 auto;
        }

        .admin-header h1 {
            margin: 0 0 24px;
            font-size: 1.4rem;
        }

        .admin-card {
            background: #FFFFFF;
            border: 1px solid #DDD;
            border-radius: 8px;
            padding: 24px;
        }

        .admin-card label {
            display: block;
            margin: 14px 0 6px;
            font-size: 0.85rem;
            color: #555;
        }

        .admin-card label:first-of-type {
            margin-top: 0;
        }

        .admin-card input[type="text"],
        .admin-card input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #CCC;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .admin-card br {
            display: none;
        }

        .admin-card button[type="submit"] {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: #FFFFFF;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .admin-card button[type="submit"]:hover {
            background: #111;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>로그인 페이지입니다.</h1>
        </div>
        <div class="admin-card">
            <form method="post" action="/admins/signin">
                <label for="username">아이디</label><input type="text" name="username" id="username" required autocomplete="username">
                <br>
                <label for="password">비밀번호</label><input type="password" name="password" id="password" required autocomplete="current-password">
                <br>
                <button type="submit">로그인</button>
            </form>
        </div>
    </div>
</body>
</html>
