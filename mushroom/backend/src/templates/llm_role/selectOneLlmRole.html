<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ llm_role.title }}</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #F5F5F5;
            color: #222;
            font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        }

        .admin-container {
            max-width: 640px;
            margin: 0 auto;
        }

        .admin-header h1 {
            margin: 0 0 8px;
            font-size: 1.4rem;
        }

        .admin-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            color: #888;
            font-size: 0.85rem;
        }

        .admin-card {
            background: #FFFFFF;
            border: 1px solid #DDD;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .admin-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-actions a {
            display: block;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #CCC;
            background: #FAFAFA;
            color: #222;
            font-size: 0.95rem;
            text-align: left;
            text-decoration: none;
        }

        .admin-actions a:hover {
            background: #F0F0F0;
        }

        .admin-actions a.danger {
            border-color: #E9C6C3;
            color: #B3453E;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>
                {{ llm_role.title }}
            </h1>
            <div class="admin-meta">
                <span>작성일시 {{ llm_role.created_at }}</span>
                <span>작성자명 {{ llm_role.admin_id }}</span>
            </div>
        </div>
        <div class="admin-card">
            {{ llm_role.content }}
        </div>
        <div class="admin-actions">
            <a href="/admins/llmRoleList">시츄에이션 목록으로 돌아가기</a>
            <a href="/admins/writeform">시츄에이션 작성하기</a>
            {% if is_owner %}
                <a href="/admins/updateLlmRole/{{ llm_role.lr_num }}">수정하기</a>
                <a class="danger" href="/admins/deleteLlmRole/{{ llm_role.lr_num }}">삭제하기</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
